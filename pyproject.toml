[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neko-video-maibot"
version = "1.0.0"
description = "Bounded video context and visual media tools for MaiBot"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "maibot-plugin-sdk>=2.12.0,<3",
  "httpx>=0.28.1,<1",
  "Pillow>=12.0.0",
  "qrcode>=8.0",
  "bilibili-api-python>=17.4.0",
]

[tool.setuptools.packages.find]
include = ["neko_video*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
