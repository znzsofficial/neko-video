name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
        sdk: ['minimum', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . ruff
      - if: matrix.sdk == 'minimum'
        run: python -m pip install "maibot-plugin-sdk==2.12.0"
      - if: matrix.sdk == 'latest'
        run: python -m pip install --upgrade "maibot-plugin-sdk>=2.12.0,<3"
      - run: python -m pip check
      - run: python -m pip show maibot-plugin-sdk
      - run: python scripts/test_strict.py
      - name: Real ffprobe and ffmpeg smoke (Linux production platform)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            timeout 90s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            timeout 150s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install --yes --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          timeout 45s python scripts/check_video_binary.py
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/build_release.py
      - name: Verify final distributable with real SDK
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          archives = list(Path('dist').glob('neko-video-*.zip'))
          assert len(archives) == 1, archives
          subprocess.run([sys.executable, 'scripts/verify_release.py', str(archives[0])], check=True)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-${{ matrix.os }}-py${{ matrix.python }}-sdk-${{ matrix.sdk }}
          path: |
            dist/neko-video-*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
