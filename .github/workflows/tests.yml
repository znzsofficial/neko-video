name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete supported compatibility matrix
        type: boolean
        default: false
  schedule:
    - cron: '47 3 * * *'
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
      full: ${{ steps.changes.outputs.full }}
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        run: python .github/ci_policy.py classify --plugin neko-video
        env:
          GITHUB_TOKEN: ${{ github.token }}
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python .github/ci_policy.py docs
  tests:
    name: runtime (${{ matrix.case }})
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . ruff
      - name: Select real SDK
        run: python -m pip install --upgrade "maibot-plugin-sdk${{ matrix.sdk_spec }}"
      - run: python -m pip check
      - run: python -m pip show maibot-plugin-sdk
      - name: Run tests
        run: python scripts/test_strict.py
      - name: Real ffprobe and ffmpeg smoke (Linux production platform)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            timeout 90s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            timeout 150s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install --yes --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          timeout 45s python scripts/check_video_binary.py
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/build_release.py
      - name: Verify source package
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          archives = list(Path('dist').glob('neko-video-*.zip'))
          assert len(archives) == 1, archives
          subprocess.run([sys.executable, 'scripts/verify_release.py', str(archives[0])], check=True)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-${{ matrix.os }}-py${{ matrix.python }}-sdk-${{ matrix.sdk }}
          path: |
            dist/neko-video-*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
  ci-gate:
    if: always()
    needs: [changes, docs, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: &gate-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python .github/ci_policy.py gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
  publish-gate:
    if: always() && needs.changes.outputs.runtime == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [changes, docs, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: *gate-steps
  compatibility-proof:
    if: always() && needs.changes.outputs.full == 'true' && needs.tests.result == 'success' && needs.docs.result == 'success'
    needs: [changes, docs, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: *gate-steps
